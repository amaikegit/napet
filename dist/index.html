const $=id=>document.getElementById(id),modal=$('modal');const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=iso(new Date());const shift=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('napet-preview-v1'))}catch{}if(!state){state={pets:[{id:1,name:'Mel',tutor:'Ana Paula',phone:'(15) 99999-0101',breed:'Shih-tzu',emoji:'🐶'},{id:2,name:'Thor',tutor:'Ricardo Silva',phone:'(15) 99999-0202',breed:'Golden retriever',emoji:'🐕'},{id:3,name:'Luna',tutor:'Mariana Costa',phone:'(15) 99999-0303',breed:'Spitz alemão',emoji:'🐩'},{id:4,name:'Bento',tutor:'Carla Souza',phone:'(15) 99999-0404',breed:'Lhasa apso',emoji:'🐶'}],apps:[]};[['09:00',1,'Banho + tosa higiênica',85,'Concluído',true],['10:30',2,'Banho',110,'Confirmado',false],['13:00',3,'Banho + hidratação',95,'Agendado',false],['14:30',4,'Banho + tosa completa',120,'Confirmado',false]].forEach((a,i)=>state.apps.push({id:i+1,date:today,time:a[0],pet:a[1],service:a[2],value:a[3],status:a[4],paid:a[5],paidDate:a[5]?today:null,duration:60}));for(let n=1;n<=15;n++)state.apps.push({id:100+n,date:shift(today,-n),time:'09:00',pet:n%4+1,service:'Banho',value:60+n%3*20,status:'Concluído',paid:true,paidDate:shift(today,-n),duration:60})}let page='agenda',date=today,mode='dia',query='';function save(){try{localStorage.setItem('napet-preview-v1',JSON.stringify(state))}catch{toast('Armazenamento indisponível; dados mantidos nesta sessão.')}render()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function startWeek(d){let x=new Date(d+'T12:00:00');return shift(d,-((x.getDay()+6)%7))}function received(from,to){return state.apps.filter(a=>a.paid&&a.paidDate>=from&&a.paidDate<=to).reduce((s,a)=>s+a.value,0)}function stats(){let w=startWeek(today),m=today.slice(0,7)+'-01',a=state.apps.filter(a=>a.date===today&&a.status!=='Cancelado');return `<div class="stats"><div class="card stat"><label>Agendamentos hoje</label><strong>${a.length}</strong><small>${a.filter(a=>a.status==='Concluído').length} atendimento(s) concluído(s)</small></div><div class="card stat"><label>Recebido na semana</label><strong>${money(received(w,today))}</strong><small>De segunda-feira até hoje</small></div><div class="card stat"><label>Recebido no mês</label><strong>${money(received(m,today))}</strong><small>Somente pagamentos registrados</small></div><div class="card stat"><label>A receber hoje</label><strong>${money(a.filter(a=>!a.paid).reduce((s,a)=>s+a.value,0))}</strong><small>Atendimentos sem pagamento</small></div></div>`}function appRow(a){let p=state.pets.find(p=>p.id===a.pet);return `<div class="appointment"><div class="time">${esc(a.time)}<small>${a.duration} min</small></div><div class="avatar">${p.emoji}</div><div><div class="pet">${esc(p.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">· ${esc(p.breed)}</span></div><div class="details">${esc(p.tutor)} · ${esc(a.service)}</div><span class="badge ${a.status==='Concluído'?'done':a.status==='Cancelado'?'cancel':''}">${a.status}</span> <button style="padding:3px 7px;min-height:28px;font-size:11px" onclick="editApp(${a.id})">Editar</button></div><div class="price">${money(a.value)}<button onclick="payment(${a.id})" ${a.status==='Cancelado'?'disabled':''}>${a.paid?'✓ Pago':'Registrar pagamento'}</button></div></div>`}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('title').textContent=page==='agenda'?'Uma agenda cheia de carinho.':page==='clientes'?'Cada pet tem sua história.':page==='configuracoes'?'O Na Pet, do seu jeito.':'Seu trabalho, em números.';$('subtitle').textContent=page==='agenda'?'Organize os horários e cuide de quem faz parte da família.':page==='clientes'?'Tutores, contatos e seus melhores amigos em um só lugar.':page==='configuracoes'?'Personalize a imagem que aparece no menu lateral.':'Acompanhe o que entrou na semana e no mês.';let html=page==='configuracoes'?'':stats();if(page==='agenda'){let from=mode==='dia'?date:startWeek(date),to=mode==='dia'?date:shift(from,6);let apps=state.apps.filter(a=>a.date>=from&&a.date<=to).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));html+=`<div class="layout"><section class="card"><div class="row"><h2>Agenda de atendimentos</h2><button class="primary" onclick="editApp()">＋ Novo agendamento</button></div><div class="dates"><button onclick="move(-1)" aria-label="Data anterior">‹</button><input aria-label="Data da agenda" type="date" value="${date}" onchange="date=this.value||today;render()"><button onclick="move(1)" aria-label="Próxima data">›</button><button onclick="date=today;render()">Hoje</button><div class="tabs"><button class="${mode==='dia'?'active':''}" onclick="mode='dia';render()">Dia</button><button class="${mode==='semana'?'active':''}" onclick="mode='semana';render()">Semana</button></div></div>${apps.length?apps.map(a=>(mode==='semana'?`<div class="details" style="margin-top:16px">${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}</div>`:'')+appRow(a)).join(''):'<div class="empty">Nenhum agendamento nesta data.<br>Que tal reservar o próximo horário?</div>'}</section><aside class="card side" style="position:static;width:auto;display:block"><div class="eyebrow">TUDO NO SEU TEMPO</div><h2 style="margin-top:12px">Hoje no Na Pet</h2><p style="font-size:13px">Uma rotina organizada faz a diferença.</p>${state.apps.filter(a=>a.date===today&&a.status!=='Cancelado').map(a=>`<div class="mini row"><strong>${a.time} · ${esc(state.pets.find(p=>p.id===a.pet).name)}</strong><span>${a.status}</span></div>`).join('')}<div class="card tip">♡ <strong>Cuidado que fica</strong><p>Registre o pagamento após receber. Assim, o painel mostra as entradas reais.</p></div></aside></div>`}else if(page==='clientes'){html+=`<div class="row"><h2>Tutores e pets <span style="color:var(--muted);font-weight:400">(${state.pets.length})</span></h2><button class="primary" onclick="editPet()">＋ Cadastrar pet</button></div><input class="search" placeholder="Buscar pet ou tutor..." aria-label="Buscar pet ou tutor" value="${esc(query)}" oninput="query=this.value;renderPets()"><div class="list" id="petlist"></div>`}else if(page==='configuracoes'){html+=`<section class="card settings-card"><div class="eyebrow">IDENTIDADE DO SEU NEGÓCIO</div><h2 style="margin-top:12px">Logo do menu</h2><p>Escolha uma foto ou imagem para representar o Na Pet.</p><div class="logo-preview" id="logoPreview"></div><label class="field" for="logoFile">Selecionar imagem</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(this)"><p style="font-size:12px;margin-top:10px">JPG, PNG ou WebP · até 10 MB. A imagem será ajustada sem cortes.</p><div class="actions" style="justify-content:start"><button type="button" onclick="resetLogo()">Restaurar logo original</button></div><div class="tip card"><strong>Salvo automaticamente</strong><p>A imagem fica salva neste navegador. Para usar em outro aparelho, selecione a imagem nele também.</p></div></section>`}else{let w=startWeek(today);html+=`<section class="card"><div class="row"><div><h2>Entradas da semana</h2><p style="font-size:13px;margin-bottom:0">Pagamentos recebidos · segunda a domingo</p></div><strong style="color:var(--pink)">${money(received(w,shift(w,6)))}</strong></div><div class="chart">${Array.from({length:7},(_,i)=>{let d=shift(w,i),v=received(d,d),max=Math.max(1,...Array.from({length:7},(_,j)=>received(shift(w,j),shift(w,j))));return `<div class="bar"><b>${money(v)}</b><i style="height:${Math.max(3,v/max*140)}px"></i>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</div>`}).join('')}</div></section><section class="card" style="margin-top:20px"><h2>Entradas do mês</h2><p style="font-size:13px">Recebimentos agrupados por semana do mês atual</p><div class="chart">${Array.from({length:5},(_,i)=>{let from=today.slice(0,7)+'-'+String(i*7+1).padStart(2,'0'),to=i===4?today.slice(0,7)+'-31':shift(from,6),v=received(from,to);return `<div class="bar"><b>${money(v)}</b><i style="height:${Math.min(140,v/10)}px"></i>Semana ${i+1}</div>`}).join('')}</div></section><section class="card" style="margin-top:20px"><h2>Últimos recebimentos</h2>${state.apps.filter(a=>a.paid).sort((a,b)=>(b.paidDate+b.time).localeCompare(a.paidDate+a.time)).slice(0,8).map(a=>`<div class="mini row"><div><strong>${esc(state.pets.find(p=>p.id===a.pet).name)} · ${esc(a.service)}</strong><br><span>${new Date(a.paidDate+'T12:00:00').toLocaleDateString('pt-BR')}</span></div><strong>${money(a.value)}</strong></div>`).join('')}</section>`}$('content').innerHTML=html;if(page==='clientes')renderPets();if(page==='configuracoes')updateLogoPreview()}function renderPets(){$('petlist').innerHTML=state.pets.filter(p=>(p.name+' '+p.tutor).toLowerCase().includes(query.toLowerCase())).map(p=>`<article class="card"><div class="row"><div class="avatar">${p.emoji}</div><button onclick="editPet(${p.id})">Editar</button></div><h2 style="margin-top:16px">${esc(p.name)}</h2><p style="font-size:13px">${esc(p.breed)}</p><strong>${esc(p.tutor)}</strong><div class="details">${esc(p.phone)}</div></article>`).join('')||'<div class="empty">Nenhum cadastro encontrado.</div>'}function move(n){date=shift(date,n*(mode==='semana'?7:1));render()}function field(label,name,value='',type='text'){return `<label class="field" for="f-${name}">${label}</label><input id="f-${name}" name="${name}" value="${esc(value)}" type="${type}" required>`}function editPet(id){let p=state.pets.find(p=>p.id===id)||{};$('modalTitle').textContent=id?'Editar pet e tutor':'Cadastrar pet e tutor';$('fields').innerHTML=field('Nome do tutor','tutor',p.tutor||'')+field('WhatsApp','phone',p.phone||'','tel')+field('Nome do pet','name',p.name||'')+field('Raça / sem raça definida','breed',p.breed||'');$('form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(id)Object.assign(p,f);else state.pets.push({...f,id:Date.now(),emoji:'🐶'});modal.close();save();toast('Cadastro salvo!')};modal.showModal()}function editApp(id){if(!state.pets.length)return editPet();let a=state.apps.find(a=>a.id===id)||{date,time:'09:00',pet:state.pets[0].id,service:'Banho',value:60,duration:60,status:'Agendado'};$('modalTitle').textContent=id?'Editar agendamento':'Novo agendamento';$('fields').innerHTML=`<label class="field" for="pet">Pet e tutor</label><select name="pet" id="pet">${state.pets.map(p=>`<option value="${p.id}" ${p.id===a.pet?'selected':''}>${esc(p.name)} — ${esc(p.tutor)}</option>`).join('')}</select><div class="two"><div>${field('Data','date',a.date,'date')}</div><div>${field('Horário','time',a.time,'time')}</div></div>`+field('Serviço','service',a.service)+`<div class="two"><div>${field('Valor (R$)','value',a.value,'number')}</div><div>${field('Duração (min)','duration',a.duration,'number')}</div></div><label class="field" for="status">Status</label><select id="status" name="status">${['Agendado','Confirmado','Concluído','Cancelado'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select><p style="font-size:12px;margin-top:14px">O pagamento é registrado separadamente na agenda.</p>`;document.querySelector('[name=value]').min=0;document.querySelector('[name=value]').step='.01';document.querySelector('[name=duration]').min=15;$('form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.pet=+f.pet;f.value=+f.value;f.duration=+f.duration;let mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));if(f.status!=='Cancelado'&&state.apps.some(x=>x.id!==id&&x.date===f.date&&x.status!=='Cancelado'&&mins(f.time)<mins(x.time)+x.duration&&mins(x.time)<mins(f.time)+f.duration)){toast('Já existe um atendimento nesse horário. Escolha outro.');return}if(mins(f.time)+f.duration>1440){toast('O atendimento precisa terminar no mesmo dia.');return}if(id)Object.assign(a,f);else state.apps.push({...f,id:Date.now(),paid:false,paidDate:null});modal.close();save();toast('Agendamento salvo!')};modal.showModal()}function payment(id){let a=state.apps.find(a=>a.id===id);if(a.paid){toast('Pagamento já registrado.');return}$('modalTitle').textContent='Registrar recebimento';$('fields').innerHTML=`<p>${esc(state.pets.find(p=>p.id===a.pet).name)} · ${money(a.value)}</p>`+field('Data do recebimento','paidDate',today,'date');$('form').onsubmit=e=>{e.preventDefault();a.paidDate=new FormData(e.target).get('paidDate');if(a.paidDate>today){toast('Informe a data em que recebeu, até hoje.');return}a.paid=true;modal.close();save();toast('Pagamento registrado!')};modal.showModal()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();

const sidebar=document.getElementById('sidebar'),menuLogo=document.getElementById('menuLogo');const originalLogo=menuLogo.innerHTML;let customLogo='';try{customLogo=localStorage.getItem('napet-custom-logo-v1')||''}catch{}function applyLogo(){menuLogo.innerHTML='';if(customLogo){const img=document.createElement('img');img.src=customLogo;img.alt='Logo do Na Pet';menuLogo.appendChild(img)}else menuLogo.innerHTML=originalLogo}function updateLogoPreview(){const preview=document.getElementById('logoPreview');if(preview){preview.innerHTML=menuLogo.innerHTML;preview.querySelectorAll('[id]').forEach(el=>el.id='preview-'+el.id);preview.querySelectorAll('textPath').forEach(el=>el.setAttribute('href',el.getAttribute('href').replace('#','#preview-')))}}function resetLogo(){try{localStorage.removeItem('napet-custom-logo-v1')}catch{toast('Não foi possível salvar a alteração.');return}customLogo='';applyLogo();updateLogoPreview();toast('Logo original restaurado.')}function uploadLogo(input){const file=input.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Escolha uma imagem JPG, PNG ou WebP.');input.value='';return}if(file.size>10*1024*1024){toast('Escolha uma imagem de até 10 MB.');input.value='';return}const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{try{const factor=Math.min(1,512/image.width,512/image.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*factor));canvas.height=Math.max(1,Math.round(image.height*factor));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/png');localStorage.setItem('napet-custom-logo-v1',data);customLogo=data;applyLogo();updateLogoPreview();toast('Novo logo salvo!')}catch{toast('Não foi possível salvar a imagem. Tente uma imagem menor.')}finally{URL.revokeObjectURL(url);input.value=''}};image.onerror=()=>{URL.revokeObjectURL(url);input.value='';toast('Não foi possível abrir essa imagem.')};image.src=url}applyLogo();let menuTimer;function collapseMenu(){document.body.classList.add('menu-collapsed');menuLogo.setAttribute('aria-expanded','false');menuLogo.setAttribute('aria-label','Abrir menu lateral');if(sidebar.contains(document.activeElement))menuLogo.focus({preventScroll:true});}function scheduleMenuCollapse(){clearTimeout(menuTimer);menuTimer=setTimeout(collapseMenu,5000);}function openMenu(){document.body.classList.remove('menu-collapsed');menuLogo.setAttribute('aria-expanded','true');menuLogo.setAttribute('aria-label','Recolher menu lateral');scheduleMenuCollapse();}menuLogo.addEventListener('click',()=>{if(document.body.classList.contains('menu-collapsed'))openMenu();else{clearTimeout(menuTimer);collapseMenu();}});sidebar.addEventListener('pointerdown',e=>{if(e.target.closest('#menuLogo'))return;if(!document.body.classList.contains('menu-collapsed'))scheduleMenuCollapse();});sidebar.addEventListener('keydown',e=>{if(e.key==='Escape'){clearTimeout(menuTimer);collapseMenu();}else if(!document.body.classList.contains('menu-collapsed'))scheduleMenuCollapse();});scheduleMenuCollapse();
</script></body></html>
